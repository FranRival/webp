<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertir JPG y PNG a WebP en lote – sin límite de archivos</title>
<meta name="description" content="Convierte cientos de imágenes JPG o PNG a WebP a la vez, gratis y sin subir nada a un servidor. Todo se procesa en tu navegador.">
<style>
:root{--bg:#0f1115;--card:#171a21;--bd:#2a2f3a;--tx:#e6e8ec;--mu:#8b93a3;--ac:#4ade80;--ac2:#22c55e;--er:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:24px 16px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mu);margin:0 0 20px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
#drop.over{border-color:var(--ac);background:#14201a}
#drop b{color:var(--ac)}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:16px 0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.opts label{display:flex;align-items:center;gap:8px;color:var(--mu)}
input[type=range]{accent-color:var(--ac)}
select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;font:inherit}
input[type=number]{width:80px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px}
button{background:var(--ac2);color:#06210f;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .sp{flex:1}
#stats{color:var(--mu)}
#prog{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:12px;display:none}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.row img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--bd)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--mu);font-size:.85em;white-space:nowrap}
.ok{color:var(--ac)}.er{color:var(--er)}
.row a{color:var(--ac);text-decoration:none;font-weight:700}
.rm{background:none;color:var(--mu);padding:2px 8px;font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>Convertir JPG / PNG a WebP</h1>
<p class="sub">Sin límite de archivos. Todo se procesa en tu navegador: tus imágenes nunca se suben a ningún servidor.</p>

<div id="drop"><b>Arrastra tus imágenes aquí</b> o haz clic para seleccionarlas<br><small style="color:var(--mu)">JPG, JPEG y PNG · puedes cargar cientos a la vez</small></div>
<input id="file" type="file" accept="image/jpeg,image/png" multiple hidden>

<div class="opts">
  <label>Modo <select id="mode"><option value="hq" selected>Alta calidad (recomendado)</option><option value="ll">Sin pérdida real (solo Chrome/Edge)</option><option value="c">Personalizado</option></select></label>
  <label id="ql" style="display:none">Calidad <input id="q" type="range" min="10" max="100" value="92"> <span id="qv">92</span>%</label>
  <label><input type="checkbox" id="sk" checked> Omitir si el WebP pesa más</label>
  <label>Ancho máx. (px) <input id="mw" type="number" min="0" placeholder="0 = original"></label>
</div>

<div class="bar">
  <button id="go" disabled>Convertir</button>
  <button id="zip" class="sec" disabled>Descargar todo (.zip)</button>
  <button id="clr" class="sec" disabled>Limpiar</button>
  <span class="sp"></span>
  <span id="stats"></span>
</div>
<div id="prog"><i></i></div>
<div id="list"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var items=[],busy=false;
  var drop=$('drop'),fi=$('file'),list=$('list');

  function fmt(b){return b>1048576?(b/1048576).toFixed(2)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
  function addFiles(fs){
    Array.prototype.forEach.call(fs,function(f){
      if(!/^image\/(jpeg|png)$/.test(f.type))return;
      items.push({file:f,url:URL.createObjectURL(f),blob:null,state:'pend',err:''});
    });
    render();
  }
  function render(){
    list.innerHTML='';
    items.forEach(function(it,i){
      var r=document.createElement('div');r.className='row';
      var st='';
      if(it.state==='done'){
        var diff=Math.round((1-it.blob.size/it.file.size)*100);
        st='<span class="ok">'+fmt(it.file.size)+' → '+fmt(it.blob.size)+' ('+(diff>=0?'-':'+')+Math.abs(diff)+'%)</span> <a href="'+it.out+'" download="'+it.name+'">Descargar</a>';
      }else if(it.state==='skip'){st='<span class="er">WebP pesaría más ('+fmt(it.bigger)+' vs '+fmt(it.file.size)+'): se omitió</span>'}
      else if(it.state==='err'){st='<span class="er">'+it.err+'</span>'}
      else st=fmt(it.file.size);
      r.innerHTML='<img src="'+it.url+'" alt=""><div class="n"></div><div class="s">'+st+'</div><button class="rm" title="Quitar">×</button>';
      r.querySelector('.n').textContent=it.file.name;
      r.querySelector('.rm').onclick=function(){if(busy)return;URL.revokeObjectURL(it.url);if(it.out)URL.revokeObjectURL(it.out);items.splice(i,1);render()};
      list.appendChild(r);
    });
    var done=items.filter(function(x){return x.state==='done'});
    $('go').disabled=busy||!items.length;
    $('zip').disabled=busy||!done.length;
    $('clr').disabled=busy||!items.length;
    var a=done.reduce(function(s,x){return s+x.file.size},0),b=done.reduce(function(s,x){return s+x.blob.size},0);
    $('stats').textContent=items.length+' archivo(s)'+(done.length?' · ahorro total: '+fmt(a-b>0?a-b:0):'');
  }
  function convert(it,q,mw,skip){
    return new Promise(function(res){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        if(mw>0&&w>mw){h=Math.round(h*mw/w);w=mw}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(function(bl){
          if(!bl||bl.type!=='image/webp'){it.state='err';it.err='Tu navegador no soporta WebP';return res()}
          if(skip&&bl.size>=it.file.size){it.state='skip';it.bigger=bl.size;it.blob=null;return res()}
          it.blob=bl;it.state='done';
          it.name=it.file.name.replace(/\.[^.]+$/,'')+'.webp';
          if(it.out)URL.revokeObjectURL(it.out);
          it.out=URL.createObjectURL(bl);res();
        },'image/webp',q);
      };
      img.onerror=function(){it.state='err';it.err='No se pudo leer';res()};
      img.src=it.url;
    });
  }
  async function run(){
    busy=true;render();
    var m=$('mode').value,q=m==='ll'?1:(m==='c'?$('q').value/100:0.92);
    var mw=parseInt($('mw').value,10)||0,skip=$('sk').checked;
    var p=$('prog');p.style.display='block';
    for(var i=0;i<items.length;i++){
      await convert(items[i],q,mw,skip);
      p.firstElementChild.style.width=((i+1)/items.length*100)+'%';
      if(i%5===0)render();
      await new Promise(function(r){setTimeout(r,0)});
    }
    busy=false;render();
    setTimeout(function(){p.style.display='none';p.firstElementChild.style.width='0'},600);
  }
  async function zipAll(){
    var z=new JSZip(),used={};
    items.forEach(function(it){
      if(it.state!=='done')return;
      var n=it.name,k=0;
      while(used[n]){k++;n=it.name.replace(/\.webp$/,'')+'-'+k+'.webp'}
      used[n]=1;z.file(n,it.blob);
    });
    $('zip').disabled=true;$('zip').textContent='Generando ZIP…';
    var bl=await z.generateAsync({type:'blob',compression:'STORE'});
    var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='imagenes-webp.zip';
    document.body.appendChild(a);a.click();a.remove();
    $('zip').textContent='Descargar todo (.zip)';render();
  }

  drop.onclick=function(){fi.click()};
  fi.onchange=function(){addFiles(fi.files);fi.value=''};
  ['dragover','dragenter'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(ev){addFiles(ev.dataTransfer.files)});
  $('mode').onchange=function(){$('ql').style.display=this.value==='c'?'flex':'none'};
  $('q').oninput=function(){$('qv').textContent=this.value};
  $('go').onclick=function(){items.forEach(function(it){if(it.state==='err'||it.state==='skip')it.state='pend'});run()};
  $('zip').onclick=zipAll;
  $('clr').onclick=function(){items.forEach(function(it){URL.revokeObjectURL(it.url);if(it.out)URL.revokeObjectURL(it.out)});items=[];render()};
  render();
})();
</script>
</body>
</html>
